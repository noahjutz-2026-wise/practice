[project]
name = "python-mlagents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noah Jutz", email = "git@noahjutz.anonaddy.com" }
]
requires-python = ">=3.10.1, <=3.10.12"
dependencies = [
    "mlagents>=1.1.0",
    "mlagents-envs>=1.1.0",
    "setuptools<70",
    "shimmy>=2.0.1",
    "stable-baselines3>=2.4.1",
    "torch==2.1.2",
    "wandb>=0.25.0",
]

[project.scripts]
ai_train = "python_mlagents.ai_train:main"
ai_eval = "python_mlagents.ai_evaluate:main"
experiment = "python_mlagents.experiment:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
