stages:
  train:
    cmd: uv run python -m python_mlagents.ai_train
    deps:
      - src/python_mlagents/ai_train.py
    params:
      - learning_rate
      - ent_coef
      - clip_range
      - n_steps
      - batch_size
      - total_timesteps
      - seed
      - log_interval_steps
      - run_mode
      - eval_model_path
      - eval_episodes
    metrics:
      - metrics.json:
          cache: false
