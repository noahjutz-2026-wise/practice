services:
  ray-head:
    image: docker.io/rayproject/ray:2.58.0-py313-gpu
    pids_limit: -1
    command: ray start --head --block --dashboard-host 0.0.0.0 --temp-dir ${RAY_TEMP_DIR}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    env_file: .env
    environment:
      RAY_PROMETHEUS_HOST: http://prometheus:9090/prometheus
      RAY_GRAFANA_HOST: http://grafana:3000/grafana
      RAY_GRAFANA_IFRAME_HOST: /grafana
      RAY_TEMP_DIR: ${RAY_TEMP_DIR}
      UV_LINK_MODE: copy
      UV_CACHE_DIR: /home/ray/.cache/uv
    healthcheck:
      test: python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8265/api/version")'
    shm_size: 4.64gb
    userns_mode: keep-id
    networks:
      - raynet
    volumes:
      - ray-tmp:${RAY_TEMP_DIR}
      - ~/.cache/uv:/home/ray/.cache/uv:z
  prometheus:
    image: docker.io/prom/prometheus:v3.14.0-distroless
    depends_on:
      ray-head:
        condition: service_healthy
    command:
      - "--config.file=${RAY_TEMP_DIR}/session_latest/metrics/prometheus/prometheus.yml"
      - "--web.route-prefix=/prometheus"
    networks:
      - raynet
    volumes:
      - ray-tmp:${RAY_TEMP_DIR}
  grafana:
    image: docker.io/grafana/grafana:13.0.8
    depends_on:
      ray-head:
        condition: service_healthy
    command:
      - "--config=${RAY_TEMP_DIR}/session_latest/metrics/grafana/grafana.ini"
      - "web"
    environment:
      - GF_PATHS_PROVISIONING=${RAY_TEMP_DIR}/session_latest/metrics/grafana/provisioning
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - raynet
    volumes:
      - ray-tmp:${RAY_TEMP_DIR}
  caddy:
    image: docker.io/caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - raynet

volumes:
  ray-tmp:
  caddy_data:
  caddy_config:

networks:
  raynet:
