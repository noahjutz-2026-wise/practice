services:
  prom:
    image: docker.io/prom/prometheus:v3.14.0-distroless
    depends_on:
      dreamer:
        condition: service_healthy
    command: |
      --config.file=/tmp/ray/session_latest/metrics/prometheus/prometheus.yml
    ports:
      - 9090:9090
    networks:
      - raynet
    volumes:
      - ray-tmp:/tmp/ray
  dreamer:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      RAY_PROMETHEUS_HOST: http://prom:9090
    healthcheck:
      test: uv run python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8265/api/version")'
    shm_size: 4.64gb
    ports:
      - 8265:8265
    networks:
      - raynet
    volumes:
      - ray-tmp:/tmp/ray


volumes:
  ray-tmp:

networks:
  raynet:
